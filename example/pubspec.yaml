name: pdf_document_scanner_example
description: Demonstrates how to use the pdf_document_scanner package.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  pdf_document_scanner:
    path: ../
  path_provider: ^2.0.11
  permission_handler: ^11.4.0
  open_file: ^3.3.1

flutter:
  uses-material-design: true