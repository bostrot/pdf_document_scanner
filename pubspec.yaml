name: pdf_document_scanner
description: |
  A Flutter package that provides a simple API for scanning documents with the phone
  camera, performing OCR on the captured image and exporting a searchable PDF. The
  package supports both single‑page and multi‑page scans, includes basic
  perspective correction via the underlying native edge detection library, and
  allows users to fine‑tune the contrast of each page before saving. The
  resulting PDF contains an invisible text layer, making the document
  searchable in any modern PDF reader.

version: 0.0.1
publish_to: "none"

environment:
  sdk: ">=3.10.4 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  dartcv4: ^2.2.1+4
  google_mlkit_text_recognition: ^0.15.1
  flutter_doc_scanner: ^0.0.20
  pdf: ^3.12.0
  image: ^4.8.0
  path_provider: ^2.0.11
  path: ^1.8.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # This package doesn't have assets of its own but relies on runtime
  # generated images. The empty section is kept to avoid a warning from
  # Flutter tooling.
  assets: []